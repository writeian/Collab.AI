<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Collab – {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="container">
      <h1><a href="{{ url_for('chat.index') }}" style="text-decoration:none; color:inherit">AI Collab</a></h1>
      <nav>
        <a href="{{ url_for('chat.index') }}">All Chats</a>
        {% if user %}
          <a href="{{ url_for('chat.create_chat') }}">Create New Chat</a>
          <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
          <a href="{{ url_for('auth.profile') }}">Profile</a>
          <a href="{{ url_for('auth.logout') }}">Logout</a>
        {% else %}
          <a href="{{ url_for('auth.login') }}">Login</a>
          <a href="{{ url_for('auth.register') }}">Register</a>
        {% endif %}
      </nav>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul class="flash">
            {% for msg in messages %}<li>{{ msg }}</li>{% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
